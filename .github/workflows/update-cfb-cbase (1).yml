name: Update CFB + College Baseball Only

# Trigger this manually from the GitHub Actions tab,
# OR push a file called .trigger-cfb-cbase to the repo root.
# This lets you re-run just these two sports without waiting for all others.

on:
  workflow_dispatch:
  push:
    paths:
      - '.trigger-cfb-cbase'
      - 'R/update_cfb.R'
      - 'R/update_college_baseball.R'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:

  # ── College Football ─────────────────────────────────────────
  cfb:
    name: "College Football (ESPN API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev libstdc++6 build-essential

      - uses: r-lib/actions/setup-r@v2.11.3
        with: { r-version: 'latest' }

      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cfb-${{ runner.os }}-latest-v5
          restore-keys: r-cfb-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('dplyr','readr','httr','jsonlite'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=TRUE)
            stopifnot(requireNamespace('httr', quietly=TRUE))
            message('packages OK')
          "

      - name: Run CFB update
        run: Rscript R/update_cfb.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/cfb
          git add docs/CFB/
          git diff --staged --quiet || git commit -m "data(cfb): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/cfb

  # ── College Baseball ─────────────────────────────────────────
  college-baseball:
    name: "College Baseball (ESPN API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev libstdc++6 build-essential

      - uses: r-lib/actions/setup-r@v2.11.3
        with: { r-version: 'latest' }

      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cbase-${{ runner.os }}-latest-v5
          restore-keys: r-cbase-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('dplyr','readr','httr','jsonlite'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=TRUE)
            stopifnot(requireNamespace('httr', quietly=TRUE))
            message('packages OK')
          "

      - name: Run College Baseball update
        run: Rscript R/update_college_baseball.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/cbase
          git add docs/CollegeBaseball/
          git diff --staged --quiet || git commit -m "data(cbase): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/cbase

  # ── Merge both branches into main ────────────────────────────
  merge:
    name: "Merge → main"
    runs-on: ubuntu-latest
    needs: [cfb, college-baseball]
    if: always()
    steps:
      - uses: actions/checkout@v4.2.2
        with: { ref: main, fetch-depth: 0 }

      - name: Merge and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in update/cfb update/cbase; do
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
              git fetch origin "$branch"
              git merge --no-ff --no-edit "origin/$branch" || {
                git merge --abort 2>/dev/null || true
              }
            fi
          done
          git push origin main

      - name: Cleanup branches
        run: |
          git push origin --delete update/cfb   2>/dev/null || true
          git push origin --delete update/cbase 2>/dev/null || true
        continue-on-error: true
