name: Update CFB Only

on:
  workflow_dispatch:
  push:
    paths:
      - 'R/update_cfb.R'
      - 'R/elo_engine.R'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  cfb:
    name: "College Football (ESPN API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libstdc++6 build-essential r-base-dev

      - uses: r-lib/actions/setup-r@v2.11.3
        with:
          r-version: 'latest'
          use-public-rspm: true

      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cfb-${{ runner.os }}-latest-v7
          restore-keys: r-cfb-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(
              c('dplyr','readr','httr','jsonlite'),
              quiet = TRUE
            )
            for (p in c('dplyr','readr','httr','jsonlite')) {
              if (!requireNamespace(p, quietly=TRUE))
                stop('Failed to install: ', p)
              message('OK: ', p)
            }
          "

      - name: Run CFB update
        run: Rscript R/update_cfb.R

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/cfb-standalone
          git add docs/CFB/
          git diff --staged --quiet || git commit -m "data(cfb): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/cfb-standalone

  merge:
    name: "Merge → main"
    runs-on: ubuntu-latest
    needs: cfb
    if: always()
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Merge and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin update/cfb-standalone > /dev/null 2>&1; then
            git fetch origin update/cfb-standalone
            git merge --no-ff --no-edit origin/update/cfb-standalone || {
              echo "Merge conflict — aborting"
              git merge --abort
              exit 1
            }
            git push origin main
          else
            echo "Branch update/cfb-standalone not found — nothing to merge"
          fi

      - name: Delete branch
        run: git push origin --delete update/cfb-standalone 2>/dev/null || true
        continue-on-error: true
