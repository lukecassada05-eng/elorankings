              message('OK: ', p)
            })
          "

      - name: Run NBA update
        run: Rscript R/update_nba.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/nba
          git add NBA/data/
          git diff --staged --quiet || git commit -m "data(nba): $(date -u '+%Y-%m-%d %H:%M UTC')"
