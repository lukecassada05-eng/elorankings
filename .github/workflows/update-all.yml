  # ── College Baseball ─────────────────────────────────────────
  # Uses ESPN public JSON API — NO KEY NEEDED
  college-baseball:
    name: "College Baseball (ESPN API, no key)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

