name: Update All Elo Rankings

on:
  schedule:
    - cron: '0 7 * * *'    # 7 AM UTC daily
    - cron: '0 19 * * *'   # 7 PM UTC daily
  workflow_dispatch:

permissions:
  contents: write

env:
  R_VERSION: '4.4.2'

# ─────────────────────────────────────────────────────────────
# PACKAGE INSTALL NOTES (why each repo is needed):
#
#  nflreadr   → nflverse.r-universe.dev  (not on standard CRAN)
#  hoopR      → sportsdataverse.r-universe.dev
#  baseballr  → sportsdataverse.r-universe.dev
#  fastRhockey→ sportsdataverse.r-universe.dev
#  cfbfastR   → NOT USED (replaced by ESPN JSON API, no key needed)
#
#  Standard CRAN packages (cloud.r-project.org):
#    dplyr, readr, httr, jsonlite, lubridate
#
# PARALLEL STRATEGY:
#  Each sport job writes to its own branch (update/nfl, etc.)
#  The merge job waits for all, then merges into main once.
#  This avoids git push conflicts from truly parallel jobs.
# ─────────────────────────────────────────────────────────────

jobs:

  # ── NFL ──────────────────────────────────────────────────────
  nfl:
    name: "NFL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-nfl-${{ runner.os }}-${{ env.R_VERSION }}-v2
          restore-keys: r-nfl-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            repos <- c(
              nflverse  = 'https://nflverse.r-universe.dev',
              CRAN      = 'https://cloud.r-project.org'
            )
            pkgs <- c('nflreadr', 'dplyr', 'readr')
            install.packages(pkgs, repos = repos, quiet = TRUE)
            # Verify
            lapply(pkgs, function(p) {
              if (!requireNamespace(p, quietly=TRUE))
                stop('FAILED to install: ', p)
              message('OK: ', p)
            })
          "

      - name: Run NFL update
        run: Rscript R/update_nfl.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/nfl
          git add NFL/data/
          git diff --staged --quiet || git commit -m "data(nfl): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/nfl

  # ── NBA ──────────────────────────────────────────────────────
