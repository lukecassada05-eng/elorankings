  # ── CFB ──────────────────────────────────────────────────────
  # Uses ESPN public JSON API — NO API KEY NEEDED
  # Only needs base R packages: httr, jsonlite, dplyr, readr (all on CRAN)
  cfb:
    name: "College Football (ESPN API, no key)"
