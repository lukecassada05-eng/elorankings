          git push --force origin update/cbase

  # ── MERGE all sport branches into main ────────────────────────
  merge:
    name: "Merge all → main"
    runs-on: ubuntu-latest
    needs: [nfl, nba, mlb, cbb, cfb, nhl, soccer, college-baseball]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge sport branches into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCHES="update/nfl update/nba update/mlb update/cbb update/cfb update/nhl update/soccer update/cbase"

          for branch in $BRANCHES; do
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
              echo "Merging $branch ..."
              git fetch origin "$branch"
              git merge --no-ff --no-edit "origin/$branch" || {
                echo "Conflict on $branch — skipping"
                git merge --abort 2>/dev/null || true
              }
            else
              echo "$branch not found (no new data) — skipping"
            fi
          done

          git push origin main

      - name: Delete sport branches
        run: |
          for branch in update/nfl update/nba update/mlb update/cbb update/cfb update/nhl update/soccer update/cbase; do
            git push origin --delete "$branch" 2>/dev/null || true
          done
        continue-on-error: true
