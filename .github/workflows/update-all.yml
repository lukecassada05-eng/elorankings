name: Update All Elo Rankings

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  R_VERSION: '4.4.2'

# ─────────────────────────────────────────────────────────────
# ROOT CAUSE OF ALL FAILURES:
#   libcurl (system library) was missing on the Ubuntu runner.
#   httr, httr2, rvest, curl, nflreadr, hoopR, baseballr,
#   fastRhockey all depend on it at the C level.
#   Fix: install system deps with apt-get BEFORE any R packages.
#
# PACKAGE REPOS:
#   nflreadr    → nflverse.r-universe.dev
#   hoopR       → sportsdataverse.r-universe.dev
#   baseballr   → sportsdataverse.r-universe.dev
#   fastRhockey → sportsdataverse.r-universe.dev
#   All others  → standard CRAN
#
# CFB + College Baseball use ESPN public JSON API (no key needed).
# Soccer uses football-data.co.uk CSV files.
# Both only need httr + jsonlite / readr (standard CRAN).
#
# PARALLEL STRATEGY:
#   Each sport job writes to its own branch (update/nfl etc.).
#   The merge job waits for all, merges into main, deletes branches.
# ─────────────────────────────────────────────────────────────

# Reusable system dependency install step — referenced by each job
# via a composite action pattern (inline for simplicity here).
# Every job that needs curl/httr runs this apt step first.

jobs:

  # ── NFL ──────────────────────────────────────────────────────
  nfl:
    name: "NFL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-nfl-${{ runner.os }}-${{ env.R_VERSION }}-v3
          restore-keys: r-nfl-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            repos <- c(
              nflverse = 'https://nflverse.r-universe.dev',
              CRAN     = 'https://cloud.r-project.org'
            )
            install.packages(c('nflreadr','dplyr','readr'), repos=repos, quiet=TRUE)
            stopifnot(requireNamespace('nflreadr', quietly=TRUE))
            message('All packages OK')
          "

      - name: Run NFL update
        run: Rscript R/update_nfl.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/nfl
          git add NFL/data/
          git diff --staged --quiet || git commit -m "data(nfl): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/nfl

  # ── NBA ──────────────────────────────────────────────────────
  nba:
    name: "NBA"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-nba-${{ runner.os }}-${{ env.R_VERSION }}-v3
          restore-keys: r-nba-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            repos <- c(
              sportsdataverse = 'https://sportsdataverse.r-universe.dev',
              CRAN            = 'https://cloud.r-project.org'
            )
            install.packages(c('hoopR','dplyr','readr'), repos=repos, quiet=TRUE)
            stopifnot(requireNamespace('hoopR', quietly=TRUE))
            message('All packages OK')
          "

      - name: Run NBA update
        run: Rscript R/update_nba.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/nba
          git add NBA/data/
          git diff --staged --quiet || git commit -m "data(nba): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/nba

  # ── MLB ──────────────────────────────────────────────────────
  mlb:
    name: "MLB"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-mlb-${{ runner.os }}-${{ env.R_VERSION }}-v3
          restore-keys: r-mlb-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            repos <- c(
              sportsdataverse = 'https://sportsdataverse.r-universe.dev',
              CRAN            = 'https://cloud.r-project.org'
            )
            install.packages(c('baseballr','dplyr','readr'), repos=repos, quiet=TRUE)
            stopifnot(requireNamespace('baseballr', quietly=TRUE))
            message('All packages OK')
          "

      - name: Run MLB update
        run: Rscript R/update_mlb.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/mlb
          git add MLB/data/
          git diff --staged --quiet || git commit -m "data(mlb): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/mlb

  # ── CBB ──────────────────────────────────────────────────────
  cbb:
    name: "College Basketball"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cbb-${{ runner.os }}-${{ env.R_VERSION }}-v3
          restore-keys: r-cbb-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            repos <- c(
              sportsdataverse = 'https://sportsdataverse.r-universe.dev',
              CRAN            = 'https://cloud.r-project.org'
            )
            install.packages(c('hoopR','dplyr','readr','lubridate'), repos=repos, quiet=TRUE)
            stopifnot(requireNamespace('hoopR', quietly=TRUE))
            message('All packages OK')
          "

      - name: Run CBB update
        run: Rscript R/update_cbb.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/cbb
          git add CBB/data/
          git diff --staged --quiet || git commit -m "data(cbb): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/cbb

  # ── CFB ──────────────────────────────────────────────────────
  # ESPN public JSON API — no API key, only needs httr+jsonlite (CRAN)
  cfb:
    name: "College Football"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cfb-${{ runner.os }}-${{ env.R_VERSION }}-v3
          restore-keys: r-cfb-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            repos <- c(CRAN = 'https://cloud.r-project.org')
            install.packages(c('dplyr','readr','httr','jsonlite'), repos=repos, quiet=TRUE)
            stopifnot(requireNamespace('httr', quietly=TRUE))
            message('All packages OK')
          "

      - name: Run CFB update
        run: Rscript R/update_cfb.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/cfb
          git add CFB/data/
          git diff --staged --quiet || git commit -m "data(cfb): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/cfb

  # ── NHL ──────────────────────────────────────────────────────
  nhl:
    name: "NHL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-nhl-${{ runner.os }}-${{ env.R_VERSION }}-v3
          restore-keys: r-nhl-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            repos <- c(
              sportsdataverse = 'https://sportsdataverse.r-universe.dev',
              CRAN            = 'https://cloud.r-project.org'
            )
            install.packages(c('fastRhockey','dplyr','readr'), repos=repos, quiet=TRUE)
            stopifnot(requireNamespace('fastRhockey', quietly=TRUE))
            message('All packages OK')
          "

      - name: Run NHL update
        run: Rscript R/update_nhl.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/nhl
          git add NHL/data/
          git diff --staged --quiet || git commit -m "data(nhl): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/nhl

  # ── Soccer ───────────────────────────────────────────────────
  # football-data.co.uk CSVs — only needs readr (no curl required)
  soccer:
    name: "Soccer"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Soccer already works — readr handles HTTPS fine without libcurl-dev
      # but adding it anyway for consistency and future-proofing
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-soccer-${{ runner.os }}-${{ env.R_VERSION }}-v3
          restore-keys: r-soccer-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            repos <- c(CRAN = 'https://cloud.r-project.org')
            install.packages(c('dplyr','readr'), repos=repos, quiet=TRUE)
            message('All packages OK')
          "

      - name: Run Soccer update
        run: Rscript R/update_soccer.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/soccer
          git add Soccer/data/
          git diff --staged --quiet || git commit -m "data(soccer): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/soccer

  # ── College Baseball ─────────────────────────────────────────
  # ESPN public JSON API — no key, only httr+jsonlite (CRAN)
  college-baseball:
    name: "College Baseball"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev

      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }

      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cbase-${{ runner.os }}-${{ env.R_VERSION }}-v3
          restore-keys: r-cbase-${{ runner.os }}-

      - name: Install R packages
        run: |
          Rscript -e "
            repos <- c(CRAN = 'https://cloud.r-project.org')
            install.packages(c('dplyr','readr','httr','jsonlite'), repos=repos, quiet=TRUE)
            stopifnot(requireNamespace('httr', quietly=TRUE))
            message('All packages OK')
          "

      - name: Run College Baseball update
        run: Rscript R/update_college_baseball.R

      - name: Commit to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/cbase
          git add CollegeBaseball/data/
          git diff --staged --quiet || git commit -m "data(cbase): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/cbase

  # ── MERGE all sport branches into main ────────────────────────
  merge:
    name: "Merge all → main"
    runs-on: ubuntu-latest
    needs: [nfl, nba, mlb, cbb, cfb, nhl, soccer, college-baseball]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge sport branches into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for branch in update/nfl update/nba update/mlb update/cbb update/cfb update/nhl update/soccer update/cbase; do
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
              echo "Merging $branch..."
              git fetch origin "$branch"
              git merge --no-ff --no-edit "origin/$branch" || {
                echo "Conflict on $branch — skipping"
                git merge --abort 2>/dev/null || true
              }
            else
              echo "$branch not found (no new data) — skipping"
            fi
          done

          git push origin main

      - name: Delete sport branches
        run: |
          for branch in update/nfl update/nba update/mlb update/cbb update/cfb update/nhl update/soccer update/cbase; do
            git push origin --delete "$branch" 2>/dev/null || true
          done
        continue-on-error: true
