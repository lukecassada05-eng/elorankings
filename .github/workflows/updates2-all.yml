name: Update All Elo Rankings

on:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours, on the hour (UTC): 00,03,06,09,12,15,18,21
  workflow_dispatch:

permissions:
  contents: write

env:
  R_VERSION: 'release'

# R_VERSION used to be pinned to a specific release ('4.4.2'), which broke
# the hoopR/baseballr install step once R moved past 4.4.x: those packages
# (and compiled deps like Rcpp/RcppParallel/stringi) come from
# sportsdataverse.r-universe.dev, which only serves pre-built BINARIES for
# whatever R release is current, so install.packages() silently fell back
# to compiling from source and failed ("had non-zero exit status"). The
# literal 'release' value (r-lib/actions/setup-r's own default) always
# tracks the current R version, so this can't go stale the same way again.
# libicu-dev was added to the hoopR/baseballr/nflreadr jobs' system deps as
# a defensive fallback for stringi (ICU) in case a source build is ever
# needed for some other reason, and install.packages() was switched from
# quiet=TRUE to quiet=FALSE everywhere so a future failure's real error
# shows up in the Actions log instead of just a one-line summary.
#
# FOLLOW-UP FIX: switching to R_VERSION: 'release' fixed the ORIGINAL
# install failure, but exposed a second, pre-existing bug: every job's
# cache key embedded the literal STRING '${{ env.R_VERSION }}' (i.e.
# "release" or "4.4.2"), not the actual resolved R version number. R
# installed fine under the new value (confirmed R 4.6.2 in the next run's
# logs), but GitHub's cache `restore-keys:` prefix fallback then silently
# restored an OLDER cache — built back when R_VERSION was still '4.4.2' —
# because the exact key changed (so it missed) but the loose prefix
# (`r-nfl-${{ runner.os }}-`) still matched. That handed low-level
# compiled packages (rlang, vctrs, data.table) back from a build done
# under the OLD R version, while dplyr/readr/hoopR/baseballr/nflreadr
# themselves got freshly recompiled against the NEW one — a straight ABI
# mismatch between the two, which is exactly what "undefined symbol:
# SETLENGTH" when dyn.load()-ing rlang.so/vctrs.so/data_table.so means
# (SETLENGTH's exported form differs across R's own internals between
# versions). Fix: every setup-r step now has `id: setup-r`, and every
# cache key uses `${{ steps.setup-r.outputs.installed-r-version }}` — the
# REAL resolved version (e.g. "4.6.2"), not the 'release'/'4.4.2' literal
# — so the key actually changes whenever R's version changes. The old
# `restore-keys:` prefix fallback was removed entirely rather than just
# updated, since ANY prefix-based fallback can again silently hand back a
# different-R-version cache the next time R updates; a clean (slightly
# slower) rebuild on a cache miss is the safe failure mode here, a silent
# ABI-mismatched restore across every job is not.

jobs:

  # ── NFL ──────────────────────────────────────────────────────
  nfl:
    name: "NFL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-nfl-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-v5
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('nflreadr','dplyr','readr'),
              repos=c(nflverse='https://nflverse.r-universe.dev', CRAN='https://cloud.r-project.org'),
              quiet=FALSE)
            stopifnot(requireNamespace('nflreadr',quietly=TRUE))
            message('packages OK')
          "
      - name: Run update
        run: Rscript R/update_nfl.R
      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/nfl
          git add docs/
          git diff --staged --quiet || git commit -m "data(nfl): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/nfl

  # ── NBA ──────────────────────────────────────────────────────
