        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cbb-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-v5
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('hoopR','dplyr','readr','lubridate'),
              repos=c(sportsdataverse='https://sportsdataverse.r-universe.dev', CRAN='https://cloud.r-project.org'),
              quiet=FALSE)
            stopifnot(requireNamespace('hoopR',quietly=TRUE))
            message('packages OK')
          "
      - name: Run update
        run: Rscript R/update_cbb.R
      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/cbb
          git add docs/
          git diff --staged --quiet || git commit -m "data(cbb): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/cbb

  # ── CFB ──────────────────────────────────────────────────────
  cfb:
    name: "College Football"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cfb-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-v5
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('dplyr','readr','httr','jsonlite'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=FALSE)
            stopifnot(requireNamespace('httr',quietly=TRUE))
            message('packages OK')
          "
      - name: Run update
        run: Rscript R/update_cfb.R
      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/cfb
          git add docs/
          git diff --staged --quiet || git commit -m "data(cfb): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/cfb

  # ── NHL ──────────────────────────────────────────────────────
  nhl:
    name: "NHL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-nhl-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-v5
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('dplyr','readr','httr','jsonlite'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=FALSE)
            stopifnot(requireNamespace('httr',quietly=TRUE))
            message('packages OK')
          "
      - name: Run update
        run: Rscript R/update_nhl.R
      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/nhl
          git add docs/
          git diff --staged --quiet || git commit -m "data(nhl): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/nhl

  # ── Soccer ───────────────────────────────────────────────────
  soccer:
    name: "Soccer"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-soccer-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-v5
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('dplyr','readr'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=FALSE)
            message('packages OK')
          "
      - name: Run update
        run: Rscript R/update_soccer.R
      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/soccer
          git add docs/
          git diff --staged --quiet || git commit -m "data(soccer): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/soccer

  # ── College Baseball ─────────────────────────────────────────
  college-baseball:
    name: "College Baseball"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cbase-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-v5
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('dplyr','readr','httr','jsonlite'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=FALSE)
            stopifnot(requireNamespace('httr',quietly=TRUE))
            message('packages OK')
          "
      - name: Run update
        run: Rscript R/update_college_baseball.R
      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/cbase
          git add docs/
          git diff --staged --quiet || git commit -m "data(cbase): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/cbase

  # ── Merge all sport branches into main ───────────────────────
  merge:
    name: "Merge to main"
    runs-on: ubuntu-latest
    needs: [nfl, nba, mlb, cbb, cfb, nhl, soccer, college-baseball]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge sport branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in update/nfl update/nba update/mlb update/cbb update/cfb update/nhl update/soccer update/cbase; do
            if git ls-remote --exit-code origin "$branch" > /dev/null 2>&1; then
              echo "Merging $branch..."
              git fetch origin "$branch"
              git merge --no-ff --no-edit "origin/$branch" || echo "Conflict in $branch — skipping"
            else
              echo "$branch not found — skipping"
            fi
          done
          git push origin main
      - name: Delete sport branches
        run: |
          for branch in update/nfl update/nba update/mlb update/cbb update/cfb update/nhl update/soccer update/cbase; do
            git push origin --delete "$branch" 2>/dev/null || true
          done

  # ── Backfill playoff data (runs AFTER merge, commits to main) ─
  # Runs after merge so there are no branch conflicts with sport data
  backfill:
    name: "Backfill Playoff Data"
    runs-on: ubuntu-latest
    needs: [merge]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-backfill-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-v5
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('jsonlite','httr'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=FALSE)
            stopifnot(requireNamespace('jsonlite',quietly=TRUE))
            message('packages OK')
          "
      - name: Run backfill
        run: Rscript R/backfill_playoff_data.R
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "No playoff data changes" && exit 0
          git commit -m "data(playoffs): $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done

  # ── Real standings + tiebreakers (runs AFTER backfill, commits to main) ─
  # Needs this run's <SPORT>_Elo_<yr>.csv / <SPORT>_Games_<yr>.csv (only on
  # main once nba/nhl/mlb/nfl are merged in) and writes current_field/
  # standings into the SAME tournament_<yr>.json files backfill_playoff_data.R
  # writes real games/series/eliminated into — running after backfill (not
  # in parallel with it via needs:[merge]) means this job's checkout already
  # has backfill's latest commit, so its read-merge-write of that JSON is
  # never racing backfill's own commit to the same files.
  current_standings:
    name: "Current Standings & Tiebreakers"
    runs-on: ubuntu-latest
    needs: [backfill]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-standings-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-v5
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('dplyr','readr','jsonlite'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=FALSE)
            stopifnot(requireNamespace('jsonlite',quietly=TRUE))
            message('packages OK')
          "
      - name: Run current standings + tiebreakers
        run: Rscript R/update_current_standings.R
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NBA/data/ docs/NHL/data/ docs/MLB/data/ docs/NFL/data/
          git diff --staged --quiet && echo "No standings changes" && exit 0
          git commit -m "data(standings): $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done

  # ── CFB Playoff Chance sim (runs AFTER merge, commits to main) ─
  # Needs this run's CFB_Elo_<yr>.csv / CFB_Games_<yr>.csv, which only
  # exist on main once the cfb job's branch has been merged in — same
  # reason `backfill` waits on `merge` rather than on `cfb` directly.
  # Active-season-only and a complete no-op (exits 0, no commit) outside
  # the regular season or once conference championship week starts —
  # see R/update_cfb_playoff.R's own guards for why.
  cfb_playoff:
    name: "CFB Playoff Chance"
    runs-on: ubuntu-latest
    needs: [merge]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-cfbplayoff-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-v5
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('dplyr','readr','httr','jsonlite'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=FALSE)
            stopifnot(requireNamespace('httr',quietly=TRUE))
            message('packages OK')
          "
      - name: Run playoff chance sim
        run: Rscript R/update_cfb_playoff.R
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CFB/data/
          git diff --staged --quiet && echo "No playoff chance changes" && exit 0
          git commit -m "data(cfb-playoff): $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
