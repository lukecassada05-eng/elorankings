          git diff --staged --quiet || git commit -m "data(mlb): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/mlb

  # ── CBB ──────────────────────────────────────────────────────
  cbb:
    name: "College Basketball"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev
      - uses: r-lib/actions/setup-r@v2
