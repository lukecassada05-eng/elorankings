  # ── Backfill playoff data (runs weekly + on demand) ───────────
  backfill:
    name: "Backfill Playoff Data"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages('pak', repos='https://cloud.r-project.org', quiet=TRUE)
            pak::pak(c('jsonlite'))
            message('packages OK')
          "
      - name: Run backfill
        run: Rscript R/backfill_playoff_data.R
      - name: Commit tournament JSONs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'docs/NBA/data/tournament_*.json' \
                  'docs/NHL/data/tournament_*.json' \
                  'docs/MLB/data/tournament_*.json' \
                  'docs/NFL/data/tournament_*.json' \
                  'docs/CBB/data/tournament_*.json' \
                  'docs/CollegeBaseball/data/tournament_*.json'
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "playoff data: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
