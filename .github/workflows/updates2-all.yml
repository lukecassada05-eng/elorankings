          git push --force origin update/cbase

  # ── Merge all sport branches into main ───────────────────────
  merge:
    name: "Merge to main"
    runs-on: ubuntu-latest
    needs: [nfl, nba, mlb, cbb, cfb, nhl, soccer, college-baseball]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge sport branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in update/nfl update/nba update/mlb update/cbb update/cfb update/nhl update/soccer update/cbase; do
            if git ls-remote --exit-code origin "$branch" > /dev/null 2>&1; then
              echo "Merging $branch..."
              git fetch origin "$branch"
              git merge --no-ff --no-edit "origin/$branch" || echo "Conflict in $branch — skipping"
            else
              echo "$branch not found — skipping"
            fi
          done
          git push origin main
      - name: Delete sport branches
        run: |
          for branch in update/nfl update/nba update/mlb update/cbb update/cfb update/nhl update/soccer update/cbase; do
            git push origin --delete "$branch" 2>/dev/null || true
          done

  # ── Backfill playoff data (runs AFTER merge, commits to main) ─
  # Runs after merge so there are no branch conflicts with sport data
  backfill:
    name: "Backfill Playoff Data"
    runs-on: ubuntu-latest
    needs: [merge]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '${{ env.R_VERSION }}' }
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-backfill-${{ runner.os }}-${{ env.R_VERSION }}-v4
          restore-keys: r-backfill-${{ runner.os }}-
      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('jsonlite','httr'),
              repos=c(CRAN='https://cloud.r-project.org'), quiet=TRUE)
            stopifnot(requireNamespace('jsonlite',quietly=TRUE))
            message('packages OK')
          "
      - name: Run backfill
        run: Rscript R/backfill_playoff_data.R
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/
          git diff --staged --quiet && echo "No playoff data changes" && exit 0
          git commit -m "data(playoffs): $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git push origin main && break
            echo "Push attempt $i failed, retrying..."
            git pull --rebase origin main
            sleep $((i * 3))
          done
