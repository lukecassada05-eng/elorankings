      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c('hoopR','dplyr','readr'),
              repos=c(sportsdataverse='https://sportsdataverse.r-universe.dev', CRAN='https://cloud.r-project.org'),
              quiet=FALSE)
            stopifnot(requireNamespace('hoopR',quietly=TRUE))
            message('packages OK')
          "
      - name: Run update
        run: Rscript R/update_nba.R
      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b update/nba
          git add docs/
          git diff --staged --quiet || git commit -m "data(nba): $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin update/nba

