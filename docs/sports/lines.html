  <div id="soccerLeagueTabs" hidden>

<script>
  // Tab click tracking
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-sport],[data-league]');
    if (!btn) return;
    if (typeof gtag === 'function') {
      gtag('event', 'tab_click', {
        sport: 'Lines',
        tab_name: btn.getAttribute('data-sport') || btn.getAttribute('data-league')
      });
    }
  });
</script>
